[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-version-claim-audit"
version = "0.1.0"
description = "Offline audit of documented Python version promises"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "python-version-claim-audit contributors"}]

[project.scripts]
python-version-claim-audit = "python_version_claim_audit:main"

[tool.setuptools.packages.find]
include = ["python_version_claim_audit*"]
